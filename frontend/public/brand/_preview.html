<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;font-family:sans-serif;background:#FAF8F5;}
  .row{display:flex;align-items:center;gap:40px;padding:24px;border-bottom:1px solid #E8E3DB;}
  .dark{background:#26221E;color:#fff;}
  .lbl{font:12px monospace;color:#8A8073;width:150px;flex:none;}
  .dark .lbl{color:#D5CEC3;}
  img{display:block;}
</style></head><body>
<div class="row"><div class="lbl">horizontal</div><img src="logo/afia-logo-horizontal.svg" height="64"></div>
<div class="row"><div class="lbl">horizontal dark</div><img src="logo/afia-logo-horizontal-dark.svg" height="64"></div>
<div class="row"><div class="lbl">horizontal mono</div><img src="logo/afia-logo-horizontal-mono.svg" height="64"></div>
<div class="row"><div class="lbl">stacked</div><img src="logo/afia-logo-stacked.svg" height="124"></div>
<div class="row dark"><div class="lbl">stacked dark</div><img src="logo/afia-logo-stacked-dark.svg" height="124"></div>
<div class="row"><div class="lbl">icon</div><img src="logo/afia-icon.svg" height="64"><img src="logo/afia-icon.svg" height="40"><img src="logo/afia-icon.svg" height="24"></div>
<div class="row dark"><div class="lbl">icon dark</div><img src="logo/afia-icon-dark.svg" height="64"></div>
<div class="row"><div class="lbl">wordmark</div><img src="logo/afia-wordmark.svg" height="48"></div>
<div class="row"><div class="lbl">favicon 16/32</div><img src="icons/favicon.svg" width="16" height="16"><img src="icons/favicon.svg" width="32" height="32"><img src="icons/favicon.svg" width="64" height="64"></div>
</body></html>
